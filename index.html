<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PixelPlay — Mini Games</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <script src="https://unpkg.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
    body {
      background: #0b0c14;
      color: #ffffff;
      padding: 20px 16px 90px;
      min-height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .logo {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, #a855f7, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .balance {
      background: rgba(255, 255, 255, 0.08);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(168, 85, 247, 0.4);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .card {
      border-radius: 20px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 150px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .card:active { transform: scale(0.96); }
    .card-purple { background: linear-gradient(135deg, #6b21a8, #3b0764); box-shadow: 0 8px 20px rgba(168, 85, 247, 0.25); }
    .card-blue   { background: linear-gradient(135deg, #1d4ed8, #1e3a8a); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25); }
    .card-green  { background: linear-gradient(135deg, #059669, #064e3b); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25); }
    .card-red    { background: linear-gradient(135deg, #dc2626, #7f1d1d); box-shadow: 0 8px 20px rgba(239, 68, 68, 0.25); }
    
    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .card-title { font-size: 16px; font-weight: 800; margin-top: 12px; }
    .card-sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }

    .nav {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: rgba(20, 22, 36, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #9ca3af;
      text-decoration: none;
    }
    .nav-item.active { color: #a855f7; font-weight: 600; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">PIXELPLAY</div>
    <div class="balance">
      <i data-lucide="zap" size="16" color="#facc15"></i> 1 250
    </div>
  </div>

  <div class="grid">
    <div class="card card-purple">
      <div class="icon-box"><i data-lucide="gamepad-2" size="24"></i></div>
      <div>
        <div class="card-title">Аркада</div>
        <div class="card-sub">Быстрый старт</div>
      </div>
    </div>

    <div class="card card-blue">
      <div class="icon-box"><i data-lucide="brain" size="24"></i></div>
      <div>
        <div class="card-title">Логика</div>
        <div class="card-sub">Головоломки</div>
      </div>
    </div>

    <div class="card card-green">
      <div class="icon-box"><i data-lucide="trophy" size="24"></i></div>
      <div>
        <div class="card-title">Бонусы</div>
        <div class="card-sub">Ежедневный приз</div>
      </div>
    </div>

    <div class="card card-red">
      <div class="icon-box"><i data-lucide="flame" size="24"></i></div>
      <div>
        <div class="card-title">Дуэль</div>
        <div class="card-sub">Игра на время</div>
      </div>
    </div>
  </div>

  <div class="nav">
    <a href="#" class="nav-item active"><i data-lucide="layout-grid" size="22"></i>Игры</a>
    <a href="#" class="nav-item"><i data-lucide="bar-chart-2" size="22"></i>Топ</a>
    <a href="#" class="nav-item"><i data-lucide="user" size="22"></i>Профиль</a>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
