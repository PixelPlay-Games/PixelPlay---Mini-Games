<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PixelPlay — Mini Games</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; user-select: none; }
    body { background: #0b0c14; color: #fff; padding: 20px 16px 90px; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo {
      font-size: 24px; font-weight: 900;
      background: linear-gradient(90deg, #a855f7, #3b82f6, #10b981);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .balance {
      background: rgba(255,255,255,0.08); padding: 8px 14px; border-radius: 20px;
      font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px;
      border: 1px solid rgba(168,85,247,0.4);
    }
    .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #9ca3af; margin-bottom: 14px; font-weight: 800; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .card {
      border-radius: 22px; padding: 18px 16px; display: flex; flex-direction: column;
      justify-content: space-between; height: 160px; cursor: pointer; transition: transform 0.2s;
    }
    .card:active { transform: scale(0.95); }
    .card-blue   { background: linear-gradient(135deg, #2563eb, #1e3a8a); box-shadow: 0 8px 24px rgba(37,99,235,0.35); }
    .card-purple { background: linear-gradient(135deg, #7c3aed, #3b0764); opacity: 0.6; }
    .card-green  { background: linear-gradient(135deg, #059669, #064e3b); opacity: 0.6; }
    .card-red    { background: linear-gradient(135deg, #e11d48, #881337); opacity: 0.6; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .icon-box {
      width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,0.16);
      display: flex; align-items: center; justify-content: center;
    }
    .badge { background: rgba(0,0,0,0.35); padding: 4px 8px; border-radius: 10px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .card-title { font-size: 18px; font-weight: 900; }
    .card-sub { font-size: 12px; opacity: 0.85; margin-top: 2px; font-weight: 600; }
    .nav {
      position: fixed; bottom: 16px; left: 16px; right: 16px; background: rgba(20,22,36,0.92);
      backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
      display: flex; justify-content: space-around; padding: 12px 0;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #9ca3af; text-decoration: none; font-weight: 600; }
    .nav-item.active { color: #3b82f6; font-weight: 800; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">PIXELPLAY</div>
    <div class="balance">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
      <span id="total-best">0</span>
    </div>
  </div>

  <div class="section-title">Мини-игры</div>

  <div class="grid">
    <div class="card card-blue" onclick="location.href='games/2048.html'">
      <div class="card-top">
        <div class="icon-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        </div>
        <div class="badge" style="color:#60a5fa;">Хит</div>
      </div>
      <div>
        <div class="card-title">2048</div>
        <div class="card-sub" id="best-2048">Рекорд: 0</div>
      </div>
    </div>

    <div class="card card-purple">
      <div class="card-top">
        <div class="icon-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="2"/></svg>
        </div>
        <div class="badge">Скоро</div>
      </div>
      <div>
        <div class="card-title">Игра 2</div>
        <div class="card-sub">В разработке</div>
      </div>
    </div>

    <div class="card card-green">
      <div class="card-top">
        <div class="icon-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </div>
        <div class="badge">Скоро</div>
      </div>
      <div>
        <div class="card-title">Игра 3</div>
        <div class="card-sub">В разработке</div>
      </div>
    </div>

    <div class="card card-red">
      <div class="card-top">
        <div class="icon-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        </div>
        <div class="badge">Скоро</div>
      </div>
      <div>
        <div class="card-title">Игра 4</div>
        <div class="card-sub">В разработке</div>
      </div>
    </div>
  </div>

  <div class="nav">
    <a href="#" class="nav-item active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
      Игры
    </a>
    <a href="#" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>
      Топ
    </a>
    <a href="#" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Профиль
    </a>
  </div>

  <script>
    const best2048 = localStorage.getItem('pixelplay_2048_best') || 0;
    document.getElementById('best-2048').textContent = 'Рекорд: ' + best2048;
    document.getElementById('total-best').textContent = best2048;
  </script>
</body>
</html>
