<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Сапер — PixelPlay</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; user-select: none; -webkit-user-select: none; }
    body {
      background: #0b0c14; color: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: space-between; min-height: 100vh;
      padding: 18px 14px 26px; overflow: hidden; touch-action: manipulation;
    }
    .top-bar { width: 100%; max-width: 390px; display: flex; justify-content: space-between; align-items: center; }
    .btn-icon {
      width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .btn-icon:active { transform: scale(0.92); background: rgba(255,255,255,0.15); }
    .game-title {
      font-size: 16px; font-weight: 900; letter-spacing: 1.5px;
      padding: 9px 18px; border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      color: #fff; text-transform: uppercase;
    }

    .scores { width: 100%; max-width: 390px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 12px 0; }
    .score-box {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center;
    }
    .score-box.best { border-color: rgba(244,63,94,0.5); background: linear-gradient(180deg, rgba(244,63,94,0.15), rgba(20,22,36,0.4)); }
    .score-label { font-size: 10px; text-transform: uppercase; color: #9ca3af; letter-spacing: 1px; }
    .score-val { font-size: 21px; font-weight: 800; margin-top: 2px; }
    .board-wrap {
      position: relative; width: 100%; max-width: 380px; aspect-ratio: 1/1;
      background: #141625; border-radius: 24px; padding: 11px;
      border: 1px solid rgba(255,255,255,0.09); box-shadow: 0 12px 35px rgba(0,0,0,0.55);
    }
    .board-wrap.shake { animation: shake 0.3s ease; }
    @keyframes shake { 0%,100%{transform:translate(0,0)} 25%{transform:translate(-5px,3px)} 50%{transform:translate(5px,-3px)} 75%{transform:translate(-3px,-3px)} }
    .grid-mines { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap: 5px; width: 100%; height: 100%; }
    .mcell {
      background: linear-gradient(145deg, #1e2238, #171a2b); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 900; cursor: pointer; transition: transform 0.12s, background 0.15s;
    }
    .mcell:active { transform: scale(0.92); }
    .mcell.open { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.03); cursor: default; }
    .mcell.flag { background: linear-gradient(135deg, #4c1d95, #2e1065); border-color: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,0.4); }
    .mcell.boom { background: linear-gradient(135deg, #f43f5e, #9f1239); box-shadow: 0 0 18px rgba(244,63,94,0.8); }
    .n-1 { color: #38bdf8; } .n-2 { color: #34d399; } .n-3 { color: #fb7185; }
    .n-4 { color: #c084fc; } .n-5 { color: #fbbf24; } .n-6 { color: #2dd4bf; }
    .mode-bar { display: flex; gap: 10px; width: 100%; max-width: 380px; }
    .mode-btn {
      flex: 1; padding: 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05); color: #9ca3af; font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    }
    .mode-btn.active { background: linear-gradient(90deg, #f43f5e, #a855f7); color: #fff; border-color: transparent; box-shadow: 0 6px 18px rgba(244,63,94,0.35); }
      .overlay { position: fixed; inset: 0; background: rgba(7, 8, 15, 0.85); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
    .overlay.show { display: flex; }
    .over-card { width: 100%; max-width: 310px; background: linear-gradient(180deg, rgba(30, 32, 54, 0.96), rgba(16, 18, 32, 0.98)); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 26px; padding: 24px 20px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); }
    .over-badge { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; color: #fb7185; background: rgba(244, 63, 94, 0.15); padding: 4px 10px; border-radius: 20px; margin-bottom: 8px; }
    .over-title { font-size: 24px; font-weight: 900; margin-bottom: 16px; color: #fff; }
    .over-score-box { background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px; padding: 12px; margin-bottom: 18px; }
    .over-score-lbl { font-size: 11px; color: #9ca3af; letter-spacing: 1px; margin-bottom: 4px; }
    .over-score-num { font-size: 28px; font-weight: 900; color: #fb7185; }
    .btn-restart { width: 100%; padding: 15px; border-radius: 16px; border: none; background: linear-gradient(90deg, #f43f5e, #a855f7); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; margin-bottom: 8px; }
    .btn-home-sub { width: 100%; padding: 12px; border-radius: 14px; background: transparent; border: 1px solid rgba(255, 255, 255, 0.14); color: #9ca3af; font-size: 14px; font-weight: 700; cursor: pointer; }

  </style>
</head>
<body>
  <div class="top-bar">
    <button class="btn-icon" onclick="location.href='../index.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
    <div class="game-title">САПЕР</div>
    <button class="btn-icon" onclick="initMines()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
  </div>
  <div class="scores">
    <div class="score-box"><div class="score-label">Очки</div><div class="score-val" id="smines">0</div></div>
    <div class="score-box"><div class="score-label">Мины</div><div class="score-val" id="fleft" style="color:#fb7185;">10</div></div>
    <div class="score-box best"><div class="score-label">Рекорд</div><div class="score-val" id="bmines">0</div></div>
  </div>
  <div class="board-wrap" id="wrap-mines">
    <div class="grid-mines" id="grid-mines"></div>

       <div class="overlay" id="over-mines">
      <div class="over-card">
        <div class="over-badge" id="mbadge">ИГРА ОКОНЧЕНА</div>
        <div class="over-title" id="mstatus">Бум! Мина</div>
        <div class="over-score-box">
          <div class="over-score-lbl">ТВОЙ СЧЕТ</div>
          <div class="over-score-num" id="fmines">0</div>
        </div>
        <button class="btn-restart" onclick="initMines()">Играть снова</button>
        <button class="btn-home-sub" onclick="location.href='../index.html'">В меню игр</button>
      </div>
    </div>
  </div>
  <div class="mode-bar">
    <button class="mode-btn active" id="btn-dig" onclick="setMode('dig')">Открыть клетку</button>
    <button class="mode-btn" id="btn-flag" onclick="setMode('flag')">Поставить флаг</button>
  </div>
  <script>
    const SIZE = 8, MINES_COUNT = 10;
    let board = [], opened = [], flagged = [], mode = 'dig', firstClick = true, gameOver = false, score = 0;
    let best = Number(localStorage.getItem('pixelplay_mines_best')) || 0;
    document.getElementById('bmines').textContent = best;

    function setMode(m) {
      mode = m;
      document.getElementById('btn-dig').classList.toggle('active', m === 'dig');
      document.getElementById('btn-flag').classList.toggle('active', m === 'flag');
    }

    function initMines() {
      board = Array(SIZE).fill(0).map(() => Array(SIZE).fill(0));
      opened = Array(SIZE).fill(0).map(() => Array(SIZE).fill(false));
      flagged = Array(SIZE).fill(0).map(() => Array(SIZE).fill(false));
      firstClick = true; gameOver = false; score = 0;
      document.getElementById('smines').textContent = 0;
      document.getElementById('fleft').textContent = MINES_COUNT;
      document.getElementById('over-mines').classList.remove('show');
      renderMines();
    }

    function placeMines(safeR, safeC) {
      let placed = 0;
      while (placed < MINES_COUNT) {
        let r = Math.floor(Math.random() * SIZE);
        let c = Math.floor(Math.random() * SIZE);
        if (board.at(r).at(c) !== -1 && (Math.abs(r - safeR) > 1 || Math.abs(c - safeC) > 1)) {
          board[r][c] = -1;
          placed++;
        }
      }
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board.at(r).at(c) === -1) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              let nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board.at(nr).at(nc) === -1) count++;
            }
          }
          board[r][c] = count;
        }
      }
    }

    function renderMines() {
      const g = document.getElementById('grid-mines');
      g.innerHTML = '';
      let flagsUsed = 0;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (flagged.at(r).at(c)) flagsUsed++;
          const cell = document.createElement('div');
          cell.className = 'mcell';
          if (opened.at(r).at(c)) {
            cell.classList.add('open');
            const val = board.at(r).at(c);
            if (val === -1) {
              cell.classList.add('boom');
              cell.textContent = '💣';
            } else if (val > 0) {
              cell.classList.add('n-' + val);
              cell.textContent = val;
            }
          } else if (flagged.at(r).at(c)) {
            cell.classList.add('flag');
        cell.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 3v18" stroke="#e9d5ff" stroke-width="2.5" stroke-linecap="round"/><path d="M6 4l12 4.5L6 13V4z" fill="#c084fc" stroke="#f3e8ff" stroke-width="1.5" stroke-linejoin="round"/></svg>`;

          }
          cell.onclick = () => clickCell(r, c);
          g.appendChild(cell);
        }
      }
      document.getElementById('fleft').textContent = Math.max(0, MINES_COUNT - flagsUsed);
    }

    function clickCell(r, c) {
      if (gameOver || opened.at(r).at(c)) return;
      if (mode === 'flag') {
        flagged[r][c] = !flagged.at(r).at(c);
        renderMines();
        return;
      }
      if (flagged.at(r).at(c)) return;
      if (firstClick) {
        firstClick = false;
        placeMines(r, c);
      }
      if (board.at(r).at(c) === -1) {
        revealAll();
        gameOver = true;
        const wrap = document.getElementById('wrap-mines');
        wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake');
        document.getElementById('mstatus').textContent = 'Бум! Мина';
        document.getElementById('mstatus').style.color = '#f43f5e';
       document.getElementById('mbadge').textContent = 'ИГРА ОКОНЧЕНА';
document.getElementById('mbadge').style.color = '#fb7185';
document.getElementById('fmines').style.color = '#fb7185';
document.getElementById('fmines').textContent = score;
rewardMinesCoins(score)
        document.getElementById('over-mines').classList.add('show');
        return;
      }
      floodOpen(r, c);
      renderMines();
      checkWin();
    }

    function floodOpen(r, c) {
      if (r < 0 || r >= SIZE || c < 0 || c >= SIZE || opened.at(r).at(c) || flagged.at(r).at(c)) return;
      opened[r][c] = true;
      score += 25;
      document.getElementById('smines').textContent = score;
      if (score > best) {
        best = score;
        document.getElementById('bmines').textContent = best;
        localStorage.setItem('pixelplay_mines_best', best);
      }
      if (board.at(r).at(c) === 0) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) floodOpen(r + dr, c + dc);
        }
      }
    }

    function revealAll() {
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) opened[r][c] = true;
      renderMines();
    }

    function checkWin() {
      let safeLeft = 0;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board.at(r).at(c) !== -1 && !opened.at(r).at(c)) safeLeft++;
        }
      }
      if (safeLeft === 0) {
        gameOver = true;
        score += 500;
        document.getElementById('smines').textContent = score;
        if (score > best) {
          best = score;
          document.getElementById('bmines').textContent = best;
          localStorage.setItem('pixelplay_mines_best', best);
                  rewardMinesCoins(score);

        }
        revealAll();
        document.getElementById('mstatus').textContent = 'Победа! +500';
        document.getElementById('mstatus').style.color = '#34d399';
document.getElementById('mbadge').textContent = 'ПОБЕДА!';

document.getElementById('mbadge').style.color = '#34d399';
document.getElementById('fmines').style.color = '#34d399';
document.getElementById('fmines').textContent = score;

        document.getElementById('over-mines').classList.add('show');
      }
    }

    initMines();
        function rewardMinesCoins(pts) {
      const reward = pts > 0 ? Math.max(5, Math.floor(pts / 15)) : 0;
      if (reward <= 0) return;
      const cur = localStorage.getItem('pixelplay_coins') === null ? 100 : Number(localStorage.getItem('pixelplay_coins'));
      localStorage.setItem('pixelplay_coins', cur + reward);
      const box = document.querySelector('#over-mines .over-score-box');
      if (box && !box.querySelector('.coins-earned')) {
        const tag = document.createElement('div');
        tag.className = 'coins-earned';
        tag.style.cssText = 'margin-top:8px;font-size:13px;font-weight:800;color:#fde047;';
        tag.textContent = `+${reward} PixelCoins`;
        box.appendChild(tag);
      } else if (box?.querySelector('.coins-earned')) {
        box.querySelector('.coins-earned').textContent = `+${reward} PixelCoins`;
      }
    }

  </script>
</body>
</html>
