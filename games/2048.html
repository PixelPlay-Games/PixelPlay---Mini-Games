<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2048 — PixelPlay</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; user-select: none; }
    body {
      background: #0b0c14; color: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: space-between; min-height: 100vh;
      padding: 20px 16px 30px; overflow: hidden; touch-action: none;
    }
    .top-bar { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; }
    .btn-icon {
      width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12); color: #fff; display: flex;
      align-items: center; justify-content: center; cursor: pointer;
    }
    .btn-icon:active { transform: scale(0.92); background: rgba(255,255,255,0.15); }
    .game-title {
      font-size: 32px; font-weight: 900;
      background: linear-gradient(90deg, #a855f7, #3b82f6, #10b981);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .scores { width: 100%; max-width: 400px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
    .score-box {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; align-items: center;
    }
    .score-box.best { border-color: rgba(168,85,247,0.5); background: linear-gradient(180deg, rgba(168,85,247,0.15), rgba(20,22,36,0.4)); }
    .score-label { font-size: 11px; text-transform: uppercase; color: #9ca3af; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; }
    .score-val { font-size: 24px; font-weight: 800; margin-top: 4px; }
    .board-wrapper {
      position: relative; width: 100%; max-width: 400px; aspect-ratio: 1/1;
      background: #141625; border-radius: 24px; padding: 12px; border: 1px solid rgba(255,255,255,0.08);
    }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; width: 100%; height: 100%; }
    .cell {
      background: rgba(255,255,255,0.04); border-radius: 16px; display: flex;
      align-items: center; justify-content: center; font-size: 28px; font-weight: 900;
    }
    .tile-pop { animation: pop 0.2s ease; }
    @keyframes pop { 0% { transform: scale(0.5); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
    .v-2    { background: linear-gradient(135deg, #1e293b, #334155); color: #e2e8f0; }
    .v-4    { background: linear-gradient(135deg, #1d4ed8, #2563eb); box-shadow: 0 0 15px rgba(37,99,235,0.4); }
    .v-8    { background: linear-gradient(135deg, #4f46e5, #6366f1); box-shadow: 0 0 15px rgba(99,102,241,0.45); }
    .v-16   { background: linear-gradient(135deg, #7c3aed, #9333ea); box-shadow: 0 0 18px rgba(147,51,234,0.5); }
    .v-32   { background: linear-gradient(135deg, #c026d3, #e11d48); box-shadow: 0 0 18px rgba(225,29,72,0.5); }
    .v-64   { background: linear-gradient(135deg, #dc2626, #ea580c); box-shadow: 0 0 20px rgba(234,88,12,0.6); }
    .v-128  { background: linear-gradient(135deg, #059669, #10b981); box-shadow: 0 0 22px rgba(16,185,129,0.6); font-size: 24px; }
    .v-256  { background: linear-gradient(135deg, #0d9488, #06b6d4); box-shadow: 0 0 24px rgba(6,182,212,0.65); font-size: 24px; }
    .v-512  { background: linear-gradient(135deg, #2563eb, #a855f7); box-shadow: 0 0 26px rgba(168,85,247,0.75); font-size: 24px; }
    .v-1024 { background: linear-gradient(135deg, #e11d48, #f59e0b); box-shadow: 0 0 28px rgba(245,158,11,0.8); font-size: 20px; }
    .v-2048 { background: linear-gradient(135deg, #facc15, #ef4444, #a855f7); box-shadow: 0 0 35px rgba(250,204,21,0.9); font-size: 20px; }
    .overlay {
      position: absolute; inset: 0; background: rgba(11,12,20,0.88); backdrop-filter: blur(8px);
      border-radius: 24px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 10;
    }
    .overlay.show { display: flex; }
    .btn-restart {
      padding: 14px 28px; border-radius: 16px; border: none; background: linear-gradient(90deg, #a855f7, #3b82f6);
      color: #fff; font-size: 16px; font-weight: 800; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <button class="btn-icon" onclick="location.href='../index.html'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    </button>
    <div class="game-title">2048</div>
    <button class="btn-icon" onclick="initGame()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>

  <div class="scores">
    <div class="score-box">
      <div class="score-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Счет
      </div>
      <div class="score-val" id="score">0</div>
    </div>
    <div class="score-box best">
      <div class="score-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        Рекорд
      </div>
      <div class="score-val" id="best">0</div>
    </div>
  </div>

  <div class="board-wrapper" id="board-area">
    <div class="grid" id="grid"></div>
    <div class="overlay" id="game-over">
      <h2 style="font-size:28px; font-weight:900; color:#f43f5e;">Игра окончена!</h2>
      <button class="btn-restart" onclick="initGame()">Играть снова</button>
    </div>
  </div>

  <div style="font-size:12px; color:#6b7280;">Свайпай в любую сторону</div>

  <script>
    const gridEl = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlayEl = document.getElementById('game-over');

    let board = [], score = 0;
    let best = localStorage.getItem('pixelplay_2048_best') || 0;
    bestEl.textContent = best;

    function initGame() {
      board = Array(4).fill().map(() => Array(4).fill(0));
      score = 0; scoreEl.textContent = 0;
      overlayEl.classList.remove('show');
      addTile(); addTile(); render();
    }

    function addTile() {
      let empty = [];
      for (let r = 0; r < 4; r++)
        for (let c = 0; c < 4; c++)
          if (board[r][c] === 0) empty.push({r, c});
      if (empty.length > 0) {
        let {r, c} = empty[Math.floor(Math.random() * empty.length)];
        board[r][c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render() {
      gridEl.innerHTML = '';
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = board[r][c];
          const cell = document.createElement('div');
          cell.className = 'cell' + (val ? ` v-${val <= 2048 ? val : 2048} tile-pop` : '');
          cell.textContent = val || '';
          gridEl.appendChild(cell);
        }
      }
    }

    function slide(row) {
      let arr = row.filter(v => v);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2; score += arr[i]; arr.splice(i + 1, 1);
        }
      }
      while (arr.length < 4) arr.push(0);
      return arr;
    }

    function move(dir) {
      let prev = JSON.stringify(board);
      if (dir === 'left' || dir === 'right') {
        for (let r = 0; r < 4; r++) {
          let row = dir === 'right' ? [...board[r]].reverse() : board[r];
          row = slide(row);
          board[r] = dir === 'right' ? row.reverse() : row;
        }
      } else {
        for (let c = 0; c < 4; c++) {
          let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
          if (dir === 'down') col.reverse();
          col = slide(col);
          if (dir === 'down') col.reverse();
          for (let r = 0; r < 4; r++) board[r][c] = col[r];
        }
      }
      if (prev !== JSON.stringify(board)) {
        addTile(); scoreEl.textContent = score;
        if (score > best) {
          best = score; bestEl.textContent = best;
          localStorage.setItem('pixelplay_2048_best', best);
        }
        render();
        if (checkGameOver()) overlayEl.classList.add('show');
      }
    }

    function checkGameOver() {
      for (let r = 0; r < 4; r++)
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) return false;
          if (c < 3 && board[r][c] === board[r][c + 1]) return false;
          if (r < 3 && board[r][c] === board[r + 1][c]) return false;
        }
      return true;
    }

    let startX, startY;
    const area = document.getElementById('board-area');
    area.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; });
    area.addEventListener('touchend', e => {
      if (!startX || !startY) return;
      let dx = e.changedTouches[0].clientX - startX, dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > Math.abs(dy)) { if (Math.abs(dx) > 30) move(dx > 0 ? 'right' : 'left'); }
      else { if (Math.abs(dy) > 30) move(dy > 0 ? 'down' : 'up'); }
      startX = startY = null;
    });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') move('left');
      if (e.key === 'ArrowRight') move('right');
      if (e.key === 'ArrowUp') move('up');
      if (e.key === 'ArrowDown') move('down');
    });

    initGame();
  </script>
</body>
</html>
